apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  labels:
    app: my-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-deployment
  template:
    metadata:
      labels:
        app: my-deployment
    spec:
      containers:
      - name: my-deployment
        image: nileshjaiswar/devops_intellipaat
        ports:
        - containerPort: 80


  ports:
    - port: 80
      targetPort: 80
      nodePort: 30008
